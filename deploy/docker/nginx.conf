worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # ログを stdout に
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","cf":"$http_cf_connecting_ip",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"size":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout json_combined;

  # 大容量アップロードのため
  client_max_body_size 2200m;
  proxy_request_buffering on;
  proxy_buffering        on;
  proxy_read_timeout     300s;
  proxy_send_timeout     300s;

  # Cloudflare の CF-Connecting-IP を真の IP として信頼
  # 公式リスト: https://www.cloudflare.com/ips/
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # 補助レート制限（アプリ層と多段防御）
  limit_req_zone $http_cf_connecting_ip zone=cfip:10m rate=300r/m;

  upstream app_backend {
    server 127.0.0.1:8080;
    keepalive 16;
  }

  server {
    listen 8443 ssl http2;

    ssl_certificate     /etc/nginx/internal/cert.pem;
    ssl_certificate_key /etc/nginx/internal/key.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;

    # ヘルスチェック (cloudflared / ECS / ローカル smoke-test 共通)
    location = /healthz {
      access_log off;
      proxy_pass http://app_backend/healthz;
      proxy_set_header Host $host;
    }

    # SSE エンドポイント: バッファリング無効、長時間接続を許容
    location /sse {
      proxy_pass http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        '';
      proxy_buffering    off;
      proxy_cache        off;
      chunked_transfer_encoding off;
      proxy_read_timeout 1h;
    }

    # 一般のリクエスト
    location / {
      limit_req zone=cfip burst=200 nodelay;

      proxy_pass http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection        "";
    }
  }
}
